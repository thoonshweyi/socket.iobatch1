<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO Namespace Switcher</title>
</head>
<body>
    <h1>Socket.IO Namespace Switcher</h1>

    <p>
        <a href="index.html">Index Page (/)</a>
        <a href="admin.html">Admin Page (/admin)</a>
        <a href="ns.html">Naespace Page (/namespace)</a>
    </p>

    <h3 id="current-ns">Current Namespace: (none)</h3>

    <div id="btn-container">

    </div>

    <hr/>

    <form id="messageform" action="" >
        <input type="text" name="usermessage" id="usermessage" class="" placeholder="Enter your message"/>
        <input type="submit" value="Send" />
    </form>

    <ul id="display">

    </ul>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let newli = (msg)=>{
            const newli = document.createElement('li');
            newli.textContent = msg;
            document.querySelector('#display').appendChild(newli);
        }

        // Connet to Same Origin (http://localhost:3000/ns.html)
        const rootSocket = io(); // or io (http://localhost:3000/ns.html) connect to "/"
        let currNsSocket = null;

        // receive namespace list 
        rootSocket.on('nsList',(nsData)=>{
            const btncontainer = document.querySelector('#btn-container')
            nsData.forEach((ns)=>{
                // console.log(ns);

                const btn = document.createElement('button');
                btn.textContent = ns.name;
                btn.type = 'button';
                btn.dataset.endpoint = ns.endpoint;
                
                btn.onclick = ()=>swithNamespace(ns.endpoint);

                btncontainer.appendChild(btn);
            });
        })

        function swithNamespace(endpoint){
            // console.log(endpoint);

            if(currNsSocket){
                currNsSocket.close();
            }

            document.querySelector('#current-ns').textContent = `Current namespace: ${endpoint}`;


            currNsSocket = io(endpoint); // or io (http://localhost:3000/admin.html)

            currNsSocket.on("connect", () => {
                newli(`Connected to ${endpoint}, My ID:  ${currNsSocket.id}`);
            });

            // Listen from server
            currNsSocket.on('welcome',(payload)=>{
                newli(`Event from ${payload.ns} : ${payload.msg}`);
            });

            currNsSocket.on('NsBroadcast',(payload)=>{
                newli(`${payload.ns} : ${payload.text}`);
            })
        }

        // Handle form submit
        document.querySelector("#messageform").addEventListener("submit",(e)=>{
            e.preventDefault();

            const input = document.querySelector("#usermessage");
            const getinputval = input.value.trim();
            console.log(getinputval);
            if(!getinputval) return;

            currNsSocket.emit("messageFromNSClient",{getinputval});

            input.value = '';
            input.focus();
        })



      
        // Handle disconnect
        rootSocket.on("disconnect",(reason)=>{
            console.log("Disconnected: ",reason);
        });

        // Handle reconnect
        rootSocket.on("reconnect",(attemptNumber)=>{
            console.log("Reconected: ",attemptNumber);
        });


        rootSocket.on('userDisconnect',(payload)=>{
            console.log("Server Say your id: ",payload)
        });


    </script>
</body>
</html>

<!-- 
disconect = CTRL+C stop the node server

reconnect = Intrnet drop / WiFi off
-->
