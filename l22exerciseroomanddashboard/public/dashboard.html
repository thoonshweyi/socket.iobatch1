<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO Room + Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body class="p-3">
    <div class="container-fluid">
        <div class="d-flex justify-content-between">
            <div>
                <h4 class="mb-3">Socket.IO Room + Dashboard</h4>
                <p>Monitor staffs, rooms, and send real-time announcement</p>
            </div>

            <div>
                <a href="/" class="btn btn-sm btn-dark">Open Chat</a>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header">
                <p class="card-title">Total Online Users</p>
            </div>
            <div class="card-body d-flex justify-content-between">
                <h3 id="totalusers">0</h3>
                <span class="badge text-success">Live</span>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <h6 class="card-title">Room Statistics</h6>
                    <span class="badge text-success">Real-time</span>
                </div>
            </div>
            <div class="card-body">
                <table>
                    <thead>
                        <tr>
                            <th>Room</th>
                            <th>Users</th>
                        </tr>
                    </thead>
                    <tbody id="roomstats">

                    </tbody>
                </table>
            </div>
        </div>


        <div class="card mb-3">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center">
                    <h6>Admin Announcement</h6>
                    <span class="badge text-success">Broadcast</span>
                </div>
            </div>

            <div class="card-body">
                <input type="text" id="adminpassword" class="form-control form-control-sm rounded-0 mb-3" placeholder="Admin password: admin123">


                <textarea id="announcementinput" class="form-control mb-3" rows="10" placeholder="Type you rmessage...."></textarea>
                <div class="d-flex justify-content-end">
                    <button id="sendannouncementbtn" class="btn btn-primary">Send Announcement</button>
                </div>

                <p id="announcementstatus" class="text-danger small opacityi-50"></p>
                    
            </div>
        </div>
    </div>
 

    <script src="/socket.io/socket.io.js"></script>
    <script>

        const totalusers = document.querySelector('#totalusers')
        const roomstats = document.querySelector('#roomstats');

        const adminpassword = document.querySelector('#adminpassword');
        const announcementinput = document.querySelector('#announcementinput');
        const sendannouncementbtn = document.querySelector('#sendannouncementbtn');
        const announcementstatus = document.querySelector('#announcementstatus');
   
        // Connet to Same Origin (http://localhost:3000)
        const rootsocket = io(); // or io (http://localhost:3000), default namespace "/"

        rootsocket.on("connect", () => {
           console.log(`Connected to /, My ID:  ${rootsocket.id}`);
        });

        rootsocket.on('dashboard:stats',(payload)=>{
            totalusers.textContent = payload.totalusers;

            roomstats.innerHTML = "";
            payload.rooms.forEach(item=>{
                const newtr = document.createElement('tr');
                newtr.innerHTML = `
                    <td>
                        <strong>${item.initroom}</strong>
                        <span>${item.count}</span>
                    </td>
                `;

                roomstats.appendChild(newtr);
            })
        })
  
        sendannouncementbtn.addEventListener('click',()=>{
            const password = adminpassword.value.trim();
            const announcementtext = announcementinput.value.trim();

            console.log(password,announcementtext);
            rootsocket.emit('adminmessageFromClient',{password,announcementtext},(res)=>{
                announcementstatus.textContent = res.message;
                if(res.ok){ 
                    announcementstatus.classList.add('success-message')
                    announcementstatus.classList.remove('error-message')
                    announcementinput.focus();
                }else{
                    announcementstatus.classList.remove('success-message')
                    announcementstatus.classList.add('error-message')
                }
            });
        });
      
    


    </script>
</body>
</html>
