<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO Room + Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body class="p-3">
    <div class="container-fluid">
        <div class="d-flex justify-content-between">
            <div>
                <h4 class="mb-3">Socket.IO Room + Dashboard</h4>
                <p>Socket.IO chatroom real-time chat project</p>
            </div>

            <div>
                <a href="/dashboard.html" class="btn btn-sm btn-dark">Open Dashboard</a>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h6 class="card-title">Set Profile</h6>
                    </div>

                    <div class="card-body">
                        <input type="text" name="name" id="name" class="form-control form-control-sm rounded-0 mb-2"  placeholder="Enter you name">
                        <div class="d-flex justify-content-between">
                            <p id="namestatus">Name: not set</p>
                            <button id="setnamebtn" class="btn btn-sm btn-primary rounded-0">Set Name</button>
                        </div>

                    </div>
                 
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h6 class="card-title">Join Room</h6>
                    </div>

                    <div class="card-body">
                        <select name="roomselect" id="roomselect" class="form-select form-select-sm rounded-0 mb-2">
                        </select>
                        <div class="d-flex justify-content-between">
                            <p id="roomstatus">Room not joined</p>
                            <button id="joinroombtn" class="btn btn-sm btn-primary rounded-0">Join Room</button>
                        </div>

                    </div>
                 
                </div>
            </div>
        </div>


        <div class="card mt-3">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center">
                    <h6>Live Chat</h6>
                    <span class="badge text-success">Socket.IO Connected</span>
                </div>
            </div>

            <div class="card-body">
                <div id="announcementBox" class="alert alert-danger"></div>
                <div id="typingstatus" class="text-muted small opacity-50"></div>
                
                <div class="chatbox">
                    <ul id="messages">

                    </ul>
                </div>

                <form id="chatform" class="chatform">
                    <div class="input-group">
                        <input type="text" id="messageinput" class="form-control" placeholder="Type you rmessage...." autocomplete="off">
                        <button type="submit" class="btn btn-primary input-group-text">Send</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
 

    <script src="/socket.io/socket.io.js"></script>
    <script>


        let newli = (msg)=>{
            const li = document.createElement('li');
            li.classList.add('list-group-item');
            li.textContent = msg;
            display.appendChild(li);

            // auto scroll to bottom
            const chatboxdiv = document.querySelector("#chat-box");
            chatboxdiv.scrollTop = chatboxdiv.scrollHeight;
        }

   
        // Connet to Same Origin (http://localhost:3000)
        const rootsocket = io(); // or io (http://localhost:3000), default namespace "/"

        rootsocket.on("connect", () => {
           console.log(`Connected to /, My ID:  ${rootsocket.id}`);
        });
      
    

        // Set Profile
        document.querySelector('#set-profile-btn').addEventListener('click',()=>{
            const name = username.value.trim();

            if(!currentNsSocket){
                newli(`Please select a namespace first`);
                return;
            }

            currentNsSocket.emit('setProfileFromClient',{name},(res)=>{
                if(!res.ok){
                    newli(`Set profile failed: ${res.error}`);
                }
                profilestatus.textContent = `Name: ${res.name}`;
                newli(`System: :Your name is now ${res.name}`);
         
            })

        });

        // Join room
        document.querySelector('#join-room-btn').addEventListener('click',()=>{
            const selectedroom = roomselect.value;

            if(!currentNsSocket){
                newli('Please select a namespace first.');
                return;
            }

            if(!selectedroom){
                newli('Please select a room');
                return;
            }

            // choose namespace
            currentNsSocket.emit('joinRoomFromClient',selectedroom,(res)=>{

                if(!res?.ok){
                    newli(`Join room failed: ${res.error}`);
                    return;
                }

                currentRoom = res.roomname;
                currentroomP.textContent = `Current Room: ${res.roomname}`;
                roomusercountP.textContent = `Room Users: ${res.count}`;

                newli(`System: You joined ${res.roomname}`);
            });

        });

        // Emit typing events
        userinput.addEventListener('input',()=>{
            if(!currentNsSocket || !currentRoom) return;

            const hastext = userinput.value.trim().length > 0;
            if(hastext){
                currentNsSocket.emit("typingFromClient");
            }else{
                currentNsSocket.emit("stopTypingFromClientNS");
            }

            if(typingtimeout) clearTimeout(typingtimeout);

            typingtimeout = setTimeout(()=>{
                currentNsSocket.emit("stopTypingFromClientNS");
            },2000)
        });
    
        // Handle form submit
        document.querySelector("#message-form").addEventListener("submit",(e)=>{
            e.preventDefault();

            const input = document.querySelector("#user-message");
            const getinputval = input.value.trim();
            console.log(getinputval);

            if(!currentNsSocket){
                newli(`Please select a namespace first.`);
                return;
            }

            if(!currentRoom){
                newli(`Please join a room first.`);
                return;
            }

            currentNsSocket.emit("messageFromClientToNS",{getinputval},(res)=>{
                if(!res?.ok){
                    newli(`Send failed: ${res.error}`);
                }
            });

            if(!getinputval) return;


            currentNsSocket.emit("stopTypingFromClientNS");

            input.value = '';
            input.focus();
        });

        // Receive message from server
        rootsocket.on("messageFromServer",(payload)=>{
            newli(`From ${payload.from} : ${payload.text}`);
        });
   
        // Handle disconnect
        rootsocket.on("disconnect",(reason)=>{
            console.log("Disconnected: ",reason);
        });

        // Handle reconnect
        rootsocket.on("reconnect",(attemptNumber)=>{
            console.log("Reconected: ",attemptNumber);
        });


    </script>
</body>
</html>

<!-- 
disconect = CTRL+C stop the node server

reconnect = Intrnet drop / WiFi off
-->
