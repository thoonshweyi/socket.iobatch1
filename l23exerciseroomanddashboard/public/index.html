<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO Room + Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body class="p-3">
    <div class="container-fluid">
        <div class="d-flex justify-content-between">
            <div>
                <h4 class="mb-3">Socket.IO Room + Dashboard</h4>
                <p>Socket.IO chatroom real-time chat project</p>
            </div>

            <div>
                <a href="/dashboard.html" class="btn btn-sm btn-dark">Open Dashboard</a>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h6 class="card-title">Set Profile</h6>
                    </div>

                    <div class="card-body">
                        <input type="text" name="name" id="name" class="form-control form-control-sm rounded-0 mb-2"  placeholder="Enter you name">
                        <div class="d-flex justify-content-between">
                            <p id="namestatus">Name: not set</p>
                            <button id="setnamebtn" class="btn btn-sm btn-primary rounded-0">Set Name</button>
                        </div>

                    </div>
                 
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h6 class="card-title">Join Room</h6>
                    </div>

                    <div class="card-body">
                        <select name="roomselect" id="roomselect" class="form-select form-select-sm rounded-0 mb-2">
                        </select>
                        <div class="d-flex justify-content-between">
                            <p id="roomstatus">Room not joined</p>
                            <button id="joinroombtn" class="btn btn-sm btn-primary rounded-0">Join Room</button>
                        </div>

                    </div>
                 
                </div>
            </div>
        </div>


        <div class="card mt-3">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center">
                    <h6>Live Chat</h6>
                    <span class="badge text-success">Socket.IO Connected</span>
                </div>
            </div>

            <div class="card-body">
                <div id="announcementbox" class="alert alert-danger"></div>
                <div id="typingstatus" class="text-muted small opacity-50"></div>
                
                <div id="chatbox" class="chatbox">
                    <ul id="messages">

                    </ul>
                </div>

                <form id="chatform" class="chatform">
                    <div class="input-group">
                        <input type="text" id="messageinput" class="form-control" placeholder="Type you rmessage...." autocomplete="off">
                        <button type="submit" class="btn btn-primary input-group-text">Send</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
 

    <script src="/socket.io/socket.io.js"></script>
    <script>

        const nameinput = document.querySelector('#name');
        const setnamebtn = document.querySelector('#setnamebtn');
        const namestatus = document.querySelector('#namestatus');

        const roomselect = document.querySelector('#roomselect');
        const joinroombtn = document.querySelector('#joinroombtn');
        const roomstatus = document.querySelector('#roomstatus');

        const chatform = document.querySelector('#chatform');
        const messageinput = document.querySelector('#messageinput');
        const messages = document.querySelector('#messages')
        const typingstatus = document.querySelector('#typingstatus');
        
        const announcementbox = document.querySelector('#announcementbox');

        let currentRoom = null;
        let typingtimeout = null;

        let newli = (msg)=>{
            const li = document.createElement('li');
            li.classList.add('list-group-item');
            li.textContent = msg;
            messages.appendChild(li);

            // auto scroll to bottom
            const chatboxdiv = document.querySelector("#chatbox");
            chatboxdiv.scrollTop = chatboxdiv.scrollHeight;
        }

   
        // Connet to Same Origin (http://localhost:3000)
        const rootsocket = io(); // or io (http://localhost:3000), default namespace "/"

        rootsocket.on("connect", () => {
           console.log(`Connected to /, My ID:  ${rootsocket.id}`);
        });

        // Set Profile
        setnamebtn.addEventListener('click',()=>{
            const name = nameinput.value.trim();

            rootsocket.emit('setProfileFromClient',{name},(res)=>{
                if(!res.ok){
                    newli(`Set profile failed: ${res.error}`);
                }
                namestatus.textContent = `Name: ${res.name}`;
                newli(`System: :Your name is now ${res.name}`);
         
            })

        });

        // Room List
        rootsocket.on('roomList',(rooms)=>{
            roomselect.innerHTML = "";

            rooms.forEach(room=>{
                const newoption = document.createElement('option');
                newoption.value = room;
                newoption.textContent = room;
                roomselect.appendChild(newoption);
            });
        });
  
        // Join room
        joinroombtn.addEventListener('click',()=>{
            const selectedroom = roomselect.value;

            if(!selectedroom){
                newli('Please select a room');
                return;
            }

            rootsocket.emit('joinRoomFromClient',selectedroom,(res)=>{

                if(!res?.ok){
                    newli(`Join room failed: ${res.error}`);
                    return;
                }

                currentRoom = res.room;
                roomstatus.textContent = `Room ${currentRoom}`;

                newli(`System: You joined ${currentRoom}`);
            });

        });

        // Emit typing events
        messageinput.addEventListener('input',()=>{

            if(!currentRoom) return;

            const hastext = messageinput.value.trim().length > 0;
            if(hastext){
                rootsocket.emit("typingFromClient");
            }else{
                rootsocket.emit("stopTypingFromClient");
            }

            if(typingtimeout) clearTimeout(typingtimeout);

            typingtimeout = setTimeout(()=>{
                rootsocket.emit("stopTypingFromClient");
            },2000)
        });
    
        // Typing Status
        rootsocket.on('typingFromServer',(payload)=>{
            typingstatus.textContent = `${payload.from} is typing...`;

            if(typingtimeout) clearTimeout(typingtimeout);

            typingtimeout = setTimeout(()=>{
                 typingstatus.textContent = '';
            },2000)
        });

        // Handle form submit
        chatform.addEventListener("submit",(e)=>{
            e.preventDefault();

            const getinputval = messageinput.value.trim();
            console.log(getinputval);

            if(!currentRoom){
                newli(`Please join a room first.`);
                return;
            }

            rootsocket.emit("messageFromClient",{getinputval},(res)=>{
                if(!res?.ok){
                    newli(`Send failed: ${res.error}`);
                }
            });

            if(!getinputval) return;

            rootsocket.emit("stopTypingFromClient");

            messageinput.value = '';
            messageinput.focus();
        });

        // Receive message from server
        rootsocket.on("messageFromServer",(payload)=>{
            newli(`From ${payload.from} : ${payload.text} (${payload.at})`);
        });

        // Admin Announcement
        rootsocket.on("adminmessageFromServer",(payload)=>{
            announcementbox.style.display = 'block';
            announcementbox.textContent = `Announcement: ${payload.text} : (${payload.at})`;

        });
   
        // Handle disconnect
        rootsocket.on("disconnect",(reason)=>{
            console.log("Disconnected: ",reason);
        });

        // Handle reconnect
        rootsocket.on("reconnect",(attemptNumber)=>{
            console.log("Reconected: ",attemptNumber);
        });


    </script>
</body>
</html>

<!-- 
disconect = CTRL+C stop the node server

reconnect = Intrnet drop / WiFi off
-->
